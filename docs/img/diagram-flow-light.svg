<svg xmlns="http://www.w3.org/2000/svg" width="960" height="574" viewBox="0 0 960 574">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="24" dy="0.0">How a request flows</tspan></text>
<text x="24" y="56" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="24" dy="0.0">Laya makes the decisions in milliseconds; the language models do the writing.</tspan></text>
<rect x="24" y="112" width="108" height="64" rx="32" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="78" y="139" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle"><tspan x="78" dy="0.0">Your question</tspan><tspan x="78" dy="17.6">+ files</tspan></text>
<rect x="840" y="112" width="96" height="64" rx="32" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="888" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle"><tspan x="888" dy="0.0">Answer</tspan></text>
<rect x="152" y="86" width="150" height="176" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="166" y="100" width="26" height="26" rx="13" fill="#1f2328"/>
<text x="179" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="179" dy="0.0">1</tspan></text>
<text x="200" y="119" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="200" dy="0.0">Compress</tspan></text>
<text x="166" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="166" dy="0.0">Cut files into chunks.</tspan><tspan x="166" dy="17.6">Keep the ones that</tspan><tspan x="166" dy="17.6">help answer.</tspan></text>
<rect x="166" y="226" width="82" height="22" rx="11" fill="#e6f4ef" stroke="#1a7f64" stroke-width="1"/>
<text x="207.0" y="241.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a7f64" text-anchor="middle"><tspan x="207.0" dy="0.0">embedder</tspan></text>
<rect x="166" y="198" width="50" height="22" rx="11" fill="#f3eeff" stroke="#8250df" stroke-width="1"/>
<text x="191.0" y="213.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8250df" text-anchor="middle"><tspan x="191.0" dy="0.0">Laya</tspan></text>
<path d="M304,174 L318,174" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="318.0,174.0 309.0,178.3 309.0,169.7" fill="#59636e"/>
<rect x="320" y="86" width="150" height="176" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="334" y="100" width="26" height="26" rx="13" fill="#1f2328"/>
<text x="347" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="347" dy="0.0">2</tspan></text>
<text x="368" y="119" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="368" dy="0.0">Route</tspan></text>
<text x="334" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="334" dy="0.0">Pick the model, and</tspan><tspan x="334" dy="17.6">whether it should</tspan><tspan x="334" dy="17.6">think first.</tspan></text>
<rect x="334" y="226" width="50" height="22" rx="11" fill="#f3eeff" stroke="#8250df" stroke-width="1"/>
<text x="359.0" y="241.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8250df" text-anchor="middle"><tspan x="359.0" dy="0.0">Laya</tspan></text>
<path d="M472,174 L486,174" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="486.0,174.0 477.0,178.3 477.0,169.7" fill="#59636e"/>
<rect x="488" y="86" width="150" height="176" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="502" y="100" width="26" height="26" rx="13" fill="#1f2328"/>
<text x="515" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="515" dy="0.0">3</tspan></text>
<text x="536" y="119" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="536" dy="0.0">Generate</tspan></text>
<text x="502" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="502" dy="0.0">Write the answer,</tspan><tspan x="502" dy="17.6">streamed word by</tspan><tspan x="502" dy="17.6">word.</tspan></text>
<rect x="502" y="226" width="138" height="22" rx="11" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1"/>
<text x="571.0" y="241.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2a78d6" text-anchor="middle"><tspan x="571.0" dy="0.0">4B or 35B model</tspan></text>
<path d="M640,174 L654,174" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="654.0,174.0 645.0,178.3 645.0,169.7" fill="#59636e"/>
<rect x="656" y="86" width="150" height="176" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="670" y="100" width="26" height="26" rx="13" fill="#1f2328"/>
<text x="683" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="683" dy="0.0">4</tspan></text>
<text x="704" y="119" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="704" dy="0.0">Check</tspan></text>
<text x="670" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="670" dy="0.0">Does the answer</tspan><tspan x="670" dy="17.6">address the</tspan><tspan x="670" dy="17.6">question?</tspan></text>
<rect x="670" y="226" width="50" height="22" rx="11" fill="#f3eeff" stroke="#8250df" stroke-width="1"/>
<text x="695.0" y="241.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8250df" text-anchor="middle"><tspan x="695.0" dy="0.0">Laya</tspan></text>
<path d="M132,144 L148,144" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="148.0,144.0 139.0,148.3 139.0,139.7" fill="#59636e"/>
<path d="M808,144 L838,144" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="838.0,144.0 829.0,148.3 829.0,139.7" fill="#59636e"/>
<path d="M731.0,262 L731.0,300 L563.0,300 L563.0,266" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="563.0,266.0 567.3,275.0 558.7,275.0" fill="#cf222e"/>
<text x="647.0" y="320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#cf222e" text-anchor="middle"><tspan x="647.0" dy="0.0">flagged? retry once: 35B model, thinking on</tspan></text>
<rect x="24" y="352" width="912" height="202" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="40" y="374" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#59636e" text-anchor="start"><tspan x="40" dy="0.0">Words used here</tspan></text>
<text x="40.0" y="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="40.0" dy="0.0">Laya</tspan></text>
<text x="40.0" y="419" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="40.0" dy="0.0">A small model (420M parameters) that answers</tspan><tspan x="40.0" dy="16.9">multiple-choice questions about your request in</tspan><tspan x="40.0" dy="16.9">~20 ms. It decides; it never writes the answer.</tspan></text>
<text x="349.3333333333333" y="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="349.3333333333333" dy="0.0">Chunk</tspan></text>
<text x="349.3333333333333" y="419" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="349.3333333333333" dy="0.0">A ~1,200-character piece of an attached file.</tspan><tspan x="349.3333333333333" dy="16.9">Only the useful chunks are sent on, so the</tspan><tspan x="349.3333333333333" dy="16.9">model reads less and answers faster.</tspan></text>
<text x="658.6666666666666" y="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="658.6666666666666" dy="0.0">Embedder</tspan></text>
<text x="658.6666666666666" y="419" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="658.6666666666666" dy="0.0">Turns text into a list of numbers so that</tspan><tspan x="658.6666666666666" dy="16.9">similar meaning gives similar numbers. Used</tspan><tspan x="658.6666666666666" dy="16.9">to rank chunks against your question.</tspan></text>
<text x="40.0" y="481" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="40.0" dy="0.0">4B / 35B model</tspan></text>
<text x="40.0" y="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="40.0" dy="0.0">The language models that write. 4B (billion</tspan><tspan x="40.0" dy="16.9">parameters) is fast; 35B is smarter but slower.</tspan><tspan x="40.0" dy="16.9">Easy requests go to the 4B one.</tspan></text>
<text x="349.3333333333333" y="481" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="349.3333333333333" dy="0.0">Thinking</tspan></text>
<text x="349.3333333333333" y="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="349.3333333333333" dy="0.0">The model first writes hidden reasoning,</tspan><tspan x="349.3333333333333" dy="16.9">then the answer. Better on hard problems,</tspan><tspan x="349.3333333333333" dy="16.9">much slower, so only used when needed.</tspan></text>
</svg>
