<svg xmlns="http://www.w3.org/2000/svg" width="960" height="518" viewBox="0 0 960 518">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="24" dy="0.0">Teaching Laya your preferences</tspan></text>
<text x="24" y="56" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="24" dy="0.0">Out of the box Laya is general-purpose. A few clicks per answer make it fit how you work.</tspan></text>
<rect x="24" y="96" width="190" height="92" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="40" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="start"><tspan x="40" dy="0.0">1 · Use it</tspan></text>
<text x="40" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start"><tspan x="40" dy="0.0">Ask questions as usual</tspan><tspan x="40" dy="16.9">on the dashboard.</tspan></text>
<rect x="254" y="96" width="200" height="92" rx="12" fill="#f3eeff" stroke="#8250df" stroke-width="1.5"/>
<text x="270" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8250df" text-anchor="start"><tspan x="270" dy="0.0">2 · Label</tspan></text>
<text x="270" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start"><tspan x="270" dy="0.0">One click per decision:</tspan><tspan x="270" dy="16.9">was Laya right?</tspan></text>
<rect x="494" y="76" width="252" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="510" y="98" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="510" dy="0.0">What if…</tspan></text>
<text x="510" y="116" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="510" dy="0.0">try new thresholds on past decisions</tspan></text>
<path d="M454,142 L474,142 L474,102 L492,102" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="492.0,102.0 483.0,106.3 483.0,97.7" fill="#59636e"/>
<rect x="494" y="140" width="252" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="510" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="510" dy="0.0">Calibrate</tspan></text>
<text x="510" y="180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="510" dy="0.0">make '70% sure' mean right 70% of the time</tspan></text>
<path d="M454,142 L474,142 L474,166 L492,166" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="492.0,166.0 483.0,170.3 483.0,161.7" fill="#59636e"/>
<rect x="494" y="204" width="252" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="510" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="510" dy="0.0">Edit questions</tspan></text>
<text x="510" y="244" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="510" dy="0.0">reword what Laya is asked, score it first</tspan></text>
<path d="M454,142 L474,142 L474,230 L492,230" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="492.0,230.0 483.0,234.3 483.0,225.7" fill="#59636e"/>
<rect x="786" y="96" width="150" height="92" rx="12" fill="#e6f4ef" stroke="#1a7f64" stroke-width="1.5"/>
<text x="802" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a7f64" text-anchor="start"><tspan x="802" dy="0.0">3 · Better</tspan></text>
<text x="802" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start"><tspan x="802" dy="0.0">routing for your</tspan><tspan x="802" dy="16.9">kind of requests</tspan></text>
<path d="M746,102 L766,102 L766,142 L784,142" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M746,166 L766,166 L766,142 L784,142" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="784.0,142.0 775.0,146.3 775.0,137.7" fill="#59636e"/>
<path d="M746,230 L766,230 L766,142 L784,142" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M214,142 L252,142" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="252.0,142.0 243.0,146.3 243.0,137.7" fill="#59636e"/>
<path d="M861,188 L861,284 L119,284 L119,190" fill="none" stroke="#59636e" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="119.0,190.0 123.3,199.0 114.7,199.0" fill="#59636e"/>
<text x="490" y="302" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle"><tspan x="490" dy="0.0">repeat: every label makes the next decisions better</tspan></text>
<rect x="24" y="330" width="912" height="168" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="40" y="352" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#59636e" text-anchor="start"><tspan x="40" dy="0.0">Words used here</tspan></text>
<text x="40.0" y="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="40.0" dy="0.0">Label</tspan></text>
<text x="40.0" y="397" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="40.0" dy="0.0">Your verdict on one of Laya's decisions,</tspan><tspan x="40.0" dy="16.9">e.g. 'this was hard', 'this answer was bad'.</tspan></text>
<text x="504.0" y="378" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="504.0" dy="0.0">Threshold</tspan></text>
<text x="504.0" y="397" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="504.0" dy="0.0">How sure Laya must be before acting,</tspan><tspan x="504.0" dy="16.9">e.g. use the big model at ≥ 60% 'hard'.</tspan></text>
<text x="40.0" y="442" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="40.0" dy="0.0">Calibration</tspan></text>
<text x="40.0" y="461" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="40.0" dy="0.0">Adjusts Laya's confidence so its</tspan><tspan x="40.0" dy="16.9">percentages match how often it's right.</tspan></text>
<text x="504.0" y="442" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start"><tspan x="504.0" dy="0.0">Fine-tuning</tspan></text>
<text x="504.0" y="461" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start"><tspan x="504.0" dy="0.0">After a few hundred labels, retrain Laya</tspan><tspan x="504.0" dy="16.9">itself on them (free Kaggle notebook).</tspan></text>
</svg>
