<svg xmlns="http://www.w3.org/2000/svg" width="960" height="582" viewBox="0 0 960 582">
<rect width="100%" height="100%" fill="#0d1117"/>
<text x="24" y="34" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="24" dy="0.0">What runs where: a 35B model on an 8 GB graphics card</tspan></text>
<text x="24" y="56" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="24" dy="0.0">The big model is split: the parts every word needs sit on the GPU, its 'experts' wait in RAM.</tspan></text>
<text x="24" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="24" dy="0.0">GPU memory</tspan></text>
<text x="24" y="131" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="24" dy="0.0">8 GB · very fast</tspan></text>
<rect x="190" y="92" width="746" height="52" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
<rect x="191" y="93" width="294.4871794871795" height="50" rx="7" fill="#4c9aff"/>
<text x="200" y="114" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d1117" text-anchor="start"><tspan x="200" dy="0.0">Qwen 35B: core</tspan></text>
<text x="200" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0d1117" text-anchor="start"><tspan x="200" dy="0.0">used for every word</tspan></text>
<rect x="487.4871794871795" y="93" width="284.9230769230769" height="50" rx="7" fill="#13233a"/>
<text x="496.4871794871795" y="114" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="496.4871794871795" dy="0.0">Nemotron 4B</tspan></text>
<text x="496.4871794871795" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start"><tspan x="496.4871794871795" dy="0.0">the fast small model</tspan></text>
<rect x="774.4102564102564" y="93" width="93.64102564102565" height="50" rx="7" fill="#a371f7"/>
<text x="783.4102564102564" y="114" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d1117" text-anchor="start"><tspan x="783.4102564102564" dy="0.0">Laya</tspan></text>
<text x="783.4102564102564" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0d1117" text-anchor="start"><tspan x="783.4102564102564" dy="0.0">decisions</tspan></text>
<rect x="870.051282051282" y="93" width="26.69230769230769" height="50" rx="7" fill="#3fb98f"/>
<text x="916.8717948717949" y="123" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle"><tspan x="916.8717948717949" dy="0.0">free</tspan></text>
<text x="873.051282051282" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#3fb98f" text-anchor="start"><tspan x="873.051282051282" dy="0.0">embedder</tspan></text>
<text x="24" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="24" dy="0.0">System RAM</tspan></text>
<text x="24" y="243" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="24" dy="0.0">30 GB · ~10× slower</tspan></text>
<rect x="190" y="204" width="746" height="52" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
<rect x="191" y="205" width="470.46666666666664" height="50" rx="7" fill="#e3a53b"/>
<text x="200" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d1117" text-anchor="start"><tspan x="200" dy="0.0">Qwen 35B: experts</tspan></text>
<text x="200" y="244" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0d1117" text-anchor="start"><tspan x="200" dy="0.0">40 layers × 256 experts, ~19 GB</tspan></text>
<rect x="663.4666666666667" y="205" width="134.76666666666668" height="50" rx="7" fill="#2e2310"/>
<text x="672.4666666666667" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="672.4666666666667" dy="0.0">Linux, apps</tspan></text>
<text x="672.4666666666667" y="244" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start"><tspan x="672.4666666666667" dy="0.0">everything else</tspan></text>
<text x="867.6166666666667" y="235" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle"><tspan x="867.6166666666667" dy="0.0">free</tspan></text>
<rect x="24" y="290" width="912" height="84" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="44" y="318" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="44" dy="0.0">Why this is fast enough</tspan></text>
<text x="44" y="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="44" dy="0.0">Each word only uses 8 of the 256 experts in every layer, so the GPU reads ~0.6 GB from RAM per word,</tspan><tspan x="44" dy="17.6">not all 19 GB. Result: 40–50 words per second from a model that couldn't fit in GPU memory at all.</tspan></text>
<rect x="24" y="394" width="912" height="168" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="40" y="416" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9198a1" text-anchor="start"><tspan x="40" dy="0.0">Words used here</tspan></text>
<text x="40.0" y="442" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="40.0" dy="0.0">GPU memory (VRAM)</tspan></text>
<text x="40.0" y="461" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="40.0" dy="0.0">The graphics card's own memory. Very fast,</tspan><tspan x="40.0" dy="16.9">but small: 8 GB here.</tspan></text>
<text x="349.3333333333333" y="442" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="349.3333333333333" dy="0.0">System RAM</tspan></text>
<text x="349.3333333333333" y="461" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="349.3333333333333" dy="0.0">The computer's main memory. Bigger, but</tspan><tspan x="349.3333333333333" dy="16.9">the GPU reads it ~10× slower.</tspan></text>
<text x="658.6666666666666" y="442" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="658.6666666666666" dy="0.0">Parameters / 35B</tspan></text>
<text x="658.6666666666666" y="461" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="658.6666666666666" dy="0.0">The numbers a model learned; 35B = 35</tspan><tspan x="658.6666666666666" dy="16.9">billion. More usually means smarter.</tspan></text>
<text x="40.0" y="506" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="40.0" dy="0.0">Experts</tspan></text>
<text x="40.0" y="525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="40.0" dy="0.0">Small sub-networks inside the model. A router</tspan><tspan x="40.0" dy="16.9">picks 8 of 256 per word, per layer.</tspan></text>
<text x="349.3333333333333" y="506" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="349.3333333333333" dy="0.0">Word (token)</tspan></text>
<text x="349.3333333333333" y="525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="349.3333333333333" dy="0.0">Models write in tokens, pieces of words.</tspan><tspan x="349.3333333333333" dy="16.9">'Words per second' is tokens per second.</tspan></text>
<text x="658.6666666666666" y="506" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="658.6666666666666" dy="0.0">Layer</tspan></text>
<text x="658.6666666666666" y="525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start"><tspan x="658.6666666666666" dy="0.0">One of the model's 40 stacked processing</tspan><tspan x="658.6666666666666" dy="16.9">steps; every word passes through all 40.</tspan></text>
</svg>
